<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GROWEXA Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 22px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .export-btn {
            background: #16a34a;
            color: white;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .stat p {
            font-size: 30px;
            font-weight: bold;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        .enquiry {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .enquiry-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .enquiry h2 {
            font-size: 18px;
        }

        .enquiry p {
            margin: 7px 0;
            color: #444;
        }

        .details {
            background: #f8fafc;
            padding: 12px;
            border-radius: 7px;
            margin-top: 12px;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #e5e7eb;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 12px;
            }

            .enquiry-top {
                flex-direction: column;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>GROWEXA Admin Dashboard</h1>

    <div class="header-buttons">
        <button class="export-btn" onclick="exportCSV()">
            📥 Export CSV
        </button>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>
</header>


<div class="container">

    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat">
            <h3>Total Enquiries</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="stat">
            <h3>New</h3>
            <p id="newCount">0</p>
        </div>

        <div class="stat">
            <h3>Contacted</h3>
            <p id="contactedCount">0</p>
        </div>

        <div class="stat">
            <h3>Completed</h3>
            <p id="completedCount">0</p>
        </div>

    </div>


    <!-- SEARCH / FILTER -->

    <div class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, email or service..."
            oninput="displayEnquiries()"
        >

        <select
            id="statusFilter"
            onchange="displayEnquiries()"
        >
            <option value="All">All Statuses</option>
            <option value="New">New</option>
            <option value="Contacted">Contacted</option>
            <option value="Completed">Completed</option>
        </select>

    </div>


    <!-- ENQUIRIES -->

    <div id="enquiriesContainer">
        Loading enquiries...
    </div>

</div>


<script>

    // ===============================
    // AUTHENTICATION
    // ===============================

    const token =
        sessionStorage.getItem("growexaAdminToken");

    if (!token) {
        window.location.href = "login.html";
    }


    // ===============================
    // DATA
    // ===============================

    let enquiries = [];


    // ===============================
    // ESCAPE HTML
    // ===============================

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ===============================
    // LOAD ENQUIRIES
    // ===============================

    async function loadEnquiries() {

        try {

            const response = await fetch(
                "/api/enquiries",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(
                    data.message || "Failed to load enquiries."
                );
            }

            enquiries = data.enquiries || [];

            updateStats();

            displayEnquiries();

        } catch (error) {

            console.error(error);

            document.getElementById(
                "enquiriesContainer"
            ).innerHTML = `
                <div class="empty">
                    Failed to load enquiries.
                </div>
            `;
        }
    }


    // ===============================
    // UPDATE STATISTICS
    // ===============================

    function updateStats() {

        const total = enquiries.length;

        const newCount =
            enquiries.filter(
                item => item.status === "New"
            ).length;

        const contactedCount =
            enquiries.filter(
                item => item.status === "Contacted"
            ).length;

        const completedCount =
            enquiries.filter(
                item => item.status === "Completed"
            ).length;

        document.getElementById(
            "totalCount"
        ).textContent = total;

        document.getElementById(
            "newCount"
        ).textContent = newCount;

        document.getElementById(
            "contactedCount"
        ).textContent = contactedCount;

        document.getElementById(
            "completedCount"
        ).textContent = completedCount;
    }


    // ===============================
    // DISPLAY ENQUIRIES
    // ===============================

    function displayEnquiries() {

        const container =
            document.getElementById(
                "enquiriesContainer"
            );

        const search =
            document.getElementById(
                "searchInput"
            ).value
            .toLowerCase();

        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        const filtered =
            enquiries.filter(item => {

                const matchesSearch =
                    (item.name || "")
                        .toLowerCase()
                        .includes(search) ||

                    (item.email || "")
                        .toLowerCase()
                        .includes(search) ||

                    (item.service || "")
                        .toLowerCase()
                        .includes(search);

                const matchesStatus =
                    status === "All" ||
                    item.status === status;

                return matchesSearch &&
                       matchesStatus;
            });


        if (filtered.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No enquiries found.
                </div>
            `;

            return;
        }


        container.innerHTML =
            filtered.map(item => `

                <div class="enquiry">

                    <div class="enquiry-top">

                        <div>
                            <h2>
                                ${escapeHTML(item.name)}
                            </h2>

                            <p>
                                📧 ${escapeHTML(item.email)}
                            </p>

                            <p>
                                💼 ${escapeHTML(item.service || "Not specified")}
                            </p>
                        </div>

                        <div>
                            <span class="status">
                                ${escapeHTML(item.status || "New")}
                            </span>
                        </div>

                    </div>


                    <div class="details">
                        ${escapeHTML(item.details || "No details provided.")}
                    </div>


                    <p>
                        <strong>Date:</strong>
                        ${escapeHTML(item.created_at || "")}
                    </p>


                    <div class="actions">

                        <button
                            class="status-btn"
                            onclick="updateStatus(${item.id}, 'New')"
                        >
                            New
                        </button>

                        <button
                            class="status-btn"
                            onclick="updateStatus(${item.id}, 'Contacted')"
                        >
                            Contacted
                        </button>

                        <button
                            class="status-btn"
                            onclick="updateStatus(${item.id}, 'Completed')"
                        >
                            Completed
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteEnquiry(${item.id})"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `).join("");
    }


    // ===============================
    // UPDATE STATUS
    // ===============================

    async function updateStatus(id, status) {

        try {

            const response = await fetch(
                `/api/enquiries/${id}/status`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


            if (response.status === 401) {
                logout();
                return;
            }


            const data =
                await response.json();


            if (!data.success) {

                alert(
                    data.message ||
                    "Failed to update status."
                );

                return;
            }


            await loadEnquiries();

        } catch (error) {

            console.error(error);

            alert(
                "Failed to update enquiry status."
            );
        }
    }


    // ===============================
    // DELETE ENQUIRY
    // ===============================

    async function deleteEnquiry(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this enquiry?"
            );

        if (!confirmDelete) {
            return;
        }


        try {

            const response = await fetch(
                `/api/enquiries/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


            if (response.status === 401) {
                logout();
                return;
            }


            const data =
                await response.json();


            if (!data.success) {

                alert(
                    data.message ||
                    "Failed to delete enquiry."
                );

                return;
            }


            await loadEnquiries();

        } catch (error) {

            console.error(error);

            alert(
                "Failed to delete enquiry."
            );
        }
    }


    // ===============================
    // EXPORT CSV
    // ===============================

    function exportCSV() {

        if (enquiries.length === 0) {

            alert(
                "There are no enquiries to export."
            );

            return;
        }


        const headers = [
            "ID",
            "Name",
            "Email",
            "Service",
            "Details",
            "Status",
            "Created At"
        ];


        const rows = enquiries.map(item => [

            item.id,

            item.name,

            item.email,

            item.service || "",

            item.details || "",

            item.status || "New",

            item.created_at || ""

        ]);


        const csvRows = [
            headers,
            ...rows
        ];


        const csvContent =
            csvRows.map(row =>

                row.map(value => {

                    const text =
                        String(value)
                        .replace(/"/g, '""');

                    return `"${text}"`;

                }).join(",")

            ).join("\n");


        const blob =
            new Blob(
                [csvContent],
                {
                    type: "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "growexa-enquiries.csv";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    }


    // ===============================
    // LOGOUT
    // ===============================

    function logout() {

        sessionStorage.removeItem(
            "growexaAdminToken"
        );

        window.location.href =
            "login.html";
    }


    // ===============================
    // START
    // ===============================

    loadEnquiries();

</script>

</body>
</html>
